<!DOCTYPE html>
<html lang="en">
<!--  -->
<head>
    <meta charset="UTF-8">
    <title>Health</title>
    <!-- <meta http-equiv="refresh" content="5"> -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #f9f9f9;
            font-family: monospace;
            font-size: 18px;
            color: #333;
        }
        .box {
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            gap: 10px;
            text-align: center;
            align-items: center;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .links a {
            color: #0066cc;
            text-decoration: none;
            padding: 5px 0;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<!--  -->
<body>
    <div class="box">
        <h3>System Status</h3>
        <p>Status: <strong>Healthy</strong></p>
        <p>Visits: {{ visits }}</p>
        
        <div class="links">
            <a href="/health">Health Check</a>
            <a href="http://localhost:5000/build" target="_blank">Unreal Engine Build</a>
            <a href="http://localhost:8000/metrics" target="_blank">Prometheus Metrics</a>
            <a href="http://localhost:9090/" target="_blank">Prometheus UI</a>
            <a href="http://localhost:3000/" target="_blank">Grafana</a>
        </div>
    </div>
    <script>
      setTimeout(() => {
        location.reload();
      }, 5000);
    </script>
</body>
<!--  -->
</html>
